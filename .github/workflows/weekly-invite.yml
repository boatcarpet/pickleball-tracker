name: Weekly pickleball invite

on:
  schedule:
    # ~9am US Eastern (13:00 UTC). Shifts an hour with daylight saving but stays morning.
    - cron: "17 13 * * 1"   # Monday  -> sign-up email to everyone with an email
    - cron: "17 13 * * 4"   # Thursday -> reminder to people marked IN or MAYBE
  workflow_dispatch:        # "Run workflow" button for testing on demand
    inputs:
      mode:
        description: "Which send to run"
        default: "auto"
        type: choice
        options:
          - auto
          - monday
          - thursday

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install firebase-admin
      - name: Send the invite / reminder
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: python send_invite.py
